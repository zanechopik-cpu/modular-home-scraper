<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modular Home Builder Finder</title>
  <style>
    :root {
      --bg: #f7f7f8;
      --bg-card: #ffffff;
      --bg-input: #ffffff;
      --text: #1a1a2e;
      --text-dim: #666;
      --border: #e0e0e0;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --green: #16a34a;
    }
    .dark {
      --bg: #0f0f1a;
      --bg-card: #1a1a2e;
      --bg-input: #1a1a2e;
      --text: #e8e8f0;
      --text-dim: #a0a0b8;
      --border: #2d2d4a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background 0.3s, color 0.3s;
    }

    header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 {
      font-size: 18px;
      background: linear-gradient(135deg, var(--accent), #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .btn-sm {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-sm:hover { color: var(--text); background: var(--bg); }

    main {
      flex: 1;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 20px;
    }

    /* Search box */
    .search-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
    }
    .search-box label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 15px;
    }
    .search-row {
      display: flex;
      gap: 8px;
    }
    .search-row input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      background: var(--bg-input);
      color: var(--text);
      outline: none;
    }
    .search-row input:focus { border-color: var(--accent); }
    .search-row button {
      padding: 10px 20px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .search-row button:hover { background: var(--accent-hover); }
    .search-row button:disabled { opacity: 0.5; cursor: not-allowed; }
    .examples {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .examples button {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    .examples button:hover { border-color: var(--accent); color: var(--accent); }

    /* Status area */
    .status-area {
      display: none;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 20px;
    }
    .status-area.show { display: block; }
    .status-line {
      font-size: 13px;
      color: var(--text-dim);
      padding: 3px 0;
    }
    .status-line.search { color: var(--accent); }
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Results */
    .results-area {
      display: none;
    }
    .results-area.show { display: block; }
    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .results-header h2 { font-size: 18px; }
    .export-buttons { display: flex; gap: 6px; }

    .results-content {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      overflow-x: auto;
      font-size: 14px;
      line-height: 1.6;
    }
    .results-content table {
      width: 100%;
      border-collapse: collapse;
      min-width: 600px;
    }
    .results-content th {
      background: var(--accent);
      color: white;
      padding: 8px 12px;
      text-align: left;
      font-size: 13px;
      white-space: nowrap;
    }
    .results-content td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      vertical-align: top;
    }
    .results-content tr:nth-child(even) { background: var(--bg); }
    .results-content a { color: var(--accent); }
    .results-content pre {
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    /* Markdown rendering */
    .results-content h1, .results-content h2, .results-content h3 {
      margin: 16px 0 8px;
    }
    .results-content p { margin: 8px 0; }
    .results-content ul, .results-content ol { padding-left: 20px; margin: 8px 0; }

    @media (max-width: 640px) {
      .search-row { flex-direction: column; }
      .examples { flex-direction: column; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <span style="font-size:24px">&#127968;</span>
    <h1>Modular Home Builder Finder</h1>
  </div>
  <button class="btn-sm" id="darkToggle" onclick="toggleDark()">Dark</button>
</header>

<main>
  <div class="search-box">
    <label>Search for modular home builders by location</label>
    <div class="search-row">
      <input type="text" id="queryInput" placeholder="e.g. Denver, Colorado" onkeydown="if(event.key==='Enter')doSearch()">
      <button id="searchBtn" onclick="doSearch()">Search</button>
    </div>
    <div class="examples">
      <button onclick="setQuery('Denver, Colorado')">Denver, CO</button>
      <button onclick="setQuery('Austin, Texas')">Austin, TX</button>
      <button onclick="setQuery('Tulsa, Oklahoma')">Tulsa, OK</button>
      <button onclick="setQuery('Portland, Oregon')">Portland, OR</button>
      <button onclick="setQuery('Nashville, Tennessee')">Nashville, TN</button>
    </div>
  </div>

  <div class="status-area" id="statusArea"></div>

  <div class="results-area" id="resultsArea">
    <div class="results-header">
      <h2 id="resultsTitle">Results</h2>
      <div class="export-buttons">
        <button class="btn-sm" onclick="exportCSV()">Export CSV</button>
        <button class="btn-sm" onclick="exportJSON()">Export JSON</button>
      </div>
    </div>
    <div class="results-content" id="resultsContent"></div>
  </div>
</main>

<script>
  // Dark mode
  function toggleDark() {
    document.body.classList.toggle('dark');
    const isDark = document.body.classList.contains('dark');
    document.getElementById('darkToggle').textContent = isDark ? 'Light' : 'Dark';
    localStorage.setItem('dark', isDark);
  }
  if (localStorage.getItem('dark') === 'true') toggleDark();

  let isSearching = false;
  let rawText = '';

  function setQuery(q) {
    document.getElementById('queryInput').value = q;
    doSearch();
  }

  async function doSearch() {
    const input = document.getElementById('queryInput');
    const query = input.value.trim();
    if (!query || isSearching) return;

    isSearching = true;
    rawText = '';
    document.getElementById('searchBtn').disabled = true;

    const statusArea = document.getElementById('statusArea');
    const resultsArea = document.getElementById('resultsArea');
    const resultsContent = document.getElementById('resultsContent');

    statusArea.className = 'status-area show';
    statusArea.innerHTML = '<div class="status-line"><span class="spinner"></span> Starting search...</div>';
    resultsArea.className = 'results-area';
    resultsContent.innerHTML = '';

    try {
      const response = await fetch('/api/search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query }),
      });

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop() || '';

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const payload = line.slice(6);
          if (payload === '[DONE]') continue;

          let data;
          try { data = JSON.parse(payload); } catch { continue; }

          switch (data.type) {
            case 'status':
              addStatus(data.message, 'status');
              break;
            case 'search':
              addStatus(data.message, 'search');
              break;
            case 'text':
              rawText += data.text;
              renderResults(query);
              break;
            case 'error':
              addStatus('Error: ' + data.message, 'error');
              break;
            case 'done':
              addStatus('Search complete!', 'done');
              break;
          }
        }
      }
    } catch (err) {
      addStatus('Connection error: ' + err.message, 'error');
    }

    isSearching = false;
    document.getElementById('searchBtn').disabled = false;
  }

  function addStatus(msg, cls) {
    const area = document.getElementById('statusArea');
    const icon = cls === 'search' ? '&#128269; ' :
                 cls === 'done' ? '&#10003; ' :
                 cls === 'error' ? '&#10007; ' :
                 '<span class="spinner"></span> ';
    // Replace spinner status lines, keep search lines
    const existing = area.querySelector('.status-line:not(.search):not(.done):not(.error)');
    if (existing && cls === 'status') {
      existing.innerHTML = icon + escapeHtml(msg);
    } else {
      const div = document.createElement('div');
      div.className = 'status-line ' + cls;
      div.innerHTML = icon + escapeHtml(msg);
      area.appendChild(div);
    }
    area.scrollTop = area.scrollHeight;
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function renderResults(query) {
    const area = document.getElementById('resultsArea');
    const content = document.getElementById('resultsContent');
    area.className = 'results-area show';
    document.getElementById('resultsTitle').textContent = 'Results for "' + query + '"';
    content.innerHTML = markdownToHtml(rawText);
  }

  // Simple markdown to HTML (handles tables, headers, lists, links, bold)
  function markdownToHtml(md) {
    const lines = md.split('\n');
    let html = '';
    let inTable = false;
    let inList = false;

    for (let i = 0; i < lines.length; i++) {
      let line = lines[i];

      // Table row
      if (line.trim().startsWith('|') && line.trim().endsWith('|')) {
        const cells = line.split('|').slice(1, -1).map(c => c.trim());
        // Skip separator rows
        if (cells.every(c => /^[-:]+$/.test(c))) continue;

        if (!inTable) {
          if (inList) { html += '</ul>'; inList = false; }
          html += '<table><thead><tr>';
          cells.forEach(c => html += '<th>' + inlineFormat(c) + '</th>');
          html += '</tr></thead><tbody>';
          inTable = true;
        } else {
          html += '<tr>';
          cells.forEach(c => html += '<td>' + inlineFormat(c) + '</td>');
          html += '</tr>';
        }
        continue;
      } else if (inTable) {
        html += '</tbody></table>';
        inTable = false;
      }

      // Headers
      if (line.startsWith('### ')) {
        if (inList) { html += '</ul>'; inList = false; }
        html += '<h3>' + inlineFormat(line.slice(4)) + '</h3>';
        continue;
      }
      if (line.startsWith('## ')) {
        if (inList) { html += '</ul>'; inList = false; }
        html += '<h2>' + inlineFormat(line.slice(3)) + '</h2>';
        continue;
      }
      if (line.startsWith('# ')) {
        if (inList) { html += '</ul>'; inList = false; }
        html += '<h1>' + inlineFormat(line.slice(2)) + '</h1>';
        continue;
      }

      // List items
      if (/^[-*]\s/.test(line.trim())) {
        if (!inList) { html += '<ul>'; inList = true; }
        html += '<li>' + inlineFormat(line.trim().slice(2)) + '</li>';
        continue;
      } else if (inList) {
        html += '</ul>';
        inList = false;
      }

      // Paragraph
      if (line.trim()) {
        html += '<p>' + inlineFormat(line) + '</p>';
      }
    }
    if (inTable) html += '</tbody></table>';
    if (inList) html += '</ul>';
    return html;
  }

  function inlineFormat(text) {
    // Escape HTML
    text = escapeHtml(text);
    // Bold
    text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    // Links [text](url)
    text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    // Bare URLs
    text = text.replace(/(https?:\/\/[^\s<]+)/g, (url) => {
      if (text.includes('href="' + url)) return url; // already linked
      return '<a href="' + url + '" target="_blank" rel="noopener">' + url + '</a>';
    });
    return text;
  }

  // Export functions
  function exportCSV() {
    if (!rawText) return;
    // Try to extract table data
    const rows = [];
    const lines = rawText.split('\n');
    for (const line of lines) {
      if (line.trim().startsWith('|') && line.trim().endsWith('|')) {
        const cells = line.split('|').slice(1, -1).map(c => c.trim());
        if (cells.every(c => /^[-:]+$/.test(c))) continue;
        rows.push(cells.map(c => '"' + c.replace(/"/g, '""') + '"').join(','));
      }
    }
    if (rows.length === 0) {
      rows.push(rawText);
    }
    download(rows.join('\n'), 'modular-home-builders.csv', 'text/csv');
  }

  function exportJSON() {
    if (!rawText) return;
    const entries = [];
    const lines = rawText.split('\n');
    let headers = [];
    for (const line of lines) {
      if (line.trim().startsWith('|') && line.trim().endsWith('|')) {
        const cells = line.split('|').slice(1, -1).map(c => c.trim());
        if (cells.every(c => /^[-:]+$/.test(c))) continue;
        if (headers.length === 0) {
          headers = cells;
        } else {
          const obj = {};
          cells.forEach((c, i) => obj[headers[i] || 'col' + i] = c);
          entries.push(obj);
        }
      }
    }
    download(JSON.stringify(entries, null, 2), 'modular-home-builders.json', 'application/json');
  }

  function download(content, filename, type) {
    const blob = new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
  }

  // Health check
  fetch('/api/health').then(r => r.json()).then(data => {
    if (!data.hasApiKey) {
      const area = document.getElementById('statusArea');
      area.className = 'status-area show';
      area.innerHTML = '<div class="status-line error" style="color:#dc2626">&#9888; No ANTHROPIC_API_KEY set. Set the environment variable and restart the server.</div>';
    }
  }).catch(() => {});
</script>
</body>
</html>
